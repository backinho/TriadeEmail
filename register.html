<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Triade Mail — Crear cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css" />
<script src="./common.js"></script>
</head>
<body>
<div class="space-bg"></div>
<main class="auth-wrap">
  <section class="glass glass-strong auth-card">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 16 L6 6 M16 16 L26 6 M16 16 L16 28"/>
      </svg>
      <b>TRIADE · MAIL</b>
    </div>
    <h1 data-i18n="create_title">Crea tu cuenta</h1>
    <p class="sub" data-i18n="create_sub">Une todos tus correos en un solo lugar</p>

    <form onsubmit="event.preventDefault(); location.href='./app.html';">
      <div class="field">
        <label data-i18n="full_name">Nombre completo</label>
        <input class="input" type="text" required placeholder="Ada Lovelace"/>
      </div>
      <div class="field">
        <label data-i18n="email">Correo electrónico</label>
        <input class="input" type="email" required placeholder="tu@triade.com"/>
      </div>
      <div class="field">
        <label data-i18n="password">Contraseña</label>
        <input class="input" type="password" required placeholder="••••••••"/>
      </div>
      <div class="field">
        <label data-i18n="confirm_password">Confirmar contraseña</label>
        <input class="input" type="password" required placeholder="••••••••"/>
      </div>
      <button class="btn primary block" data-i18n="create_account">Crear cuenta</button>
    </form>

    <div class="divider">— · —</div>
    <div class="auth-links" style="justify-content:center; gap:.4rem">
      <span data-i18n="already_account">¿Ya tienes cuenta?</span>
      <a href="./index.html" style="color:var(--accent)" data-i18n="sign_in_link">Inicia sesión</a>
    </div>
  </section>
</main>
</body>
</html>
